services:
  proximity.api:
    image: proximity.api
    build:
      context: .
      dockerfile: src/proximity/Proximity.Api/Dockerfile
    container_name: proximity-api
    ports:
      - "1000:8080"
    environment:
      ConnectionStrings__MongoDB: "mongodb://root:rootpassword@mongodb:27017"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - apinetwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nearby.api:
    image: nearby.api
    build:
      context: .
      dockerfile: src/nearbyfriends/NearbyFriends.Api/Dockerfile
    container_name: nearbyfriends-api
    ports:
      - "1001:8080"
    environment:
      postgres__ConnectionString: "Host=postgres;Port=5432;Database=nearbyfriends;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      - postgres
    networks:
      - apinetwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:latest
    restart: unless-stopped
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    networks:
      - apinetwork
    ports:
      - 27017:27017
    volumes:
      - mongodb_data_container:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s

  postgres:
    image: postgres:14.1-alpine
    container_name: postgres
    restart: unless-stopped
    networks:
      - apinetwork
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  mongodb_data_container:
  postgres:
    driver: local

networks:
  apinetwork:
    name: apinetwork-network
    driver: bridge
