services:
  proximity.api:
    image: proximity.api
    build:
      context: .
      dockerfile: src/proximity/Proximity.Api/Dockerfile
    container_name: proximity-api
    ports:
      - "1000:8080"
    environment:
      ConnectionStrings__MongoDB: "mongodb://root:rootpassword@mongodb:27017"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - apinetwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nearby.api:
    image: nearby.api
    build:
      context: .
      dockerfile: src/nearbyfriends/NearbyFriends.Api/Dockerfile
    container_name: nearbyfriends-api
    ports:
      - "1001:8080"
    environment:
      postgres__ConnectionString: "Host=postgres;Port=5432;Database=nearbyfriends;Username=postgres;Password=postgres"
      redis__ConnectionString: "redis:6379"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apinetwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  googlemaps.api:
    image: googlemaps.api
    build:
      context: .
      dockerfile: src/googlemaps/GoogleMaps.Api/Dockerfile
    container_name: googlemaps-api
    ports:
      - "1002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      MinIO__Endpoint: "http://swift:9000"
      MinIO__Bucket: "map-tiles"
      MinIO__AccessKey: "minioadmin"
      MinIO__SecretKey: "minioadmin"
    depends_on:
      swift:
        condition: service_healthy
    networks:
      - apinetwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redispubsub:
    image: redispubsub
    build:
      context: .
      dockerfile: src/redispubsub/RedisPubSub/Dockerfile
    container_name: redispubsub
    environment:
      postgres__ConnectionString: "Host=postgres;Port=5432;Database=nearbyfriends;Username=postgres;Password=postgres"
      redis__ConnectionString: "redis:6379"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - apinetwork

  frontend:
    image: frontend
    build:
      context: src/frontend/react-app
      dockerfile: Dockerfile
    container_name: react-frontend
    ports:
      - "5173:5173"
    networks:
      - apinetwork

  mongodb:
    image: mongo:latest
    restart: unless-stopped
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    networks:
      - apinetwork
    ports:
      - 27017:27017
    volumes:
      - mongodb_data_container:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s

  postgres:
    image: postgres:14.1-alpine
    container_name: postgres
    restart: unless-stopped
    networks:
      - apinetwork
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - apinetwork
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  swift:
    image: minio/minio:latest
    container_name: swift-storage
    restart: unless-stopped
    networks:
      - apinetwork
    ports:
      - "8080:9000"
      - "8081:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    volumes:
      - swift_data:/minio/data
    command: server /minio/data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://swift:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/map-tiles || true;
      /usr/bin/mc version enable myminio/map-tiles || true;
      exit 0;
      "
    depends_on:
      swift:
        condition: service_healthy
    networks:
      - apinetwork

volumes:
  mongodb_data_container:
  postgres:
    driver: local
  redis_data:
    driver: local
  swift_data:
    driver: local

networks:
  apinetwork:
    name: apinetwork-network
    driver: bridge
